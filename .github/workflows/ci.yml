name: MLFQ Scheduler Simulation & Tests

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  run-simulation:
    name: Run MLFQ Simulation & Unit Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Run Automated Unit Tests
      run: |
        python -m unittest test_mlfq.py -v

    - name: Run Comparative MLFQ Simulation
      run: |
        python cli.py --compare --sim-time 50 --processes 8

    - name: Publish Step Summary
      run: |
        cat << 'EOF' >> $GITHUB_STEP_SUMMARY
        # 🎓 OS Group Project 7: MLFQ Simulation Results
        **Course:** Operating Systems | **Problem:** #21
        
        ### 👥 Team Members
        - **AP24110010509** — VEERAPANENI VARALAKSHMI
        - **AP24110010538** — GANDHAM SAI POOJITHA
        - **AP24110012001** — KANDIMALLA KEERTHI SREE
        - **AP24110011723** — ARADHYA SINGH
        
        ---
        ### 📊 Performance Summary
        All unit tests and comparative simulations passed successfully with 0 errors!
        EOF

    - name: Upload Report Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: simulation-files
        path: |
          index.html
          app.js
          simulation_results.html
          PROJECT_REPORT.md
