name: MLFQ Scheduler Simulation & GitHub Pages Deploy

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  run-simulation:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Run Automated Unit Tests
      run: |
        python -m unittest test_mlfq.py -v

    - name: Run Head-to-Head Comparative Simulation
      run: |
        python cli.py --compare --sim-time 50 --processes 8

    - name: Upload Simulation Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: simulation-files
        path: |
          index.html
          app.js
          simulation_results.html
          PROJECT_REPORT.md

  deploy-pages:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: run-simulation
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
