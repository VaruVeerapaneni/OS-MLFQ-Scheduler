name: MLFQ Scheduler Simulation & Tests

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  run-simulation:
    name: Run MLFQ Simulation & Unit Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Run Automated Unit Tests
      run: |
        python -m unittest test_mlfq.py -v

    - name: Set up Node.js for browser script checks
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Validate inline JavaScript on every website page
      run: |
        python - <<'PY'
        from pathlib import Path
        import re
        pages = ["index.html", "comparison.html", "calculations.html", "theory.html", "docs.html"]
        for page in pages:
            source = Path(page).read_text(encoding="utf-8")
            scripts = re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>", source, flags=re.S | re.I)
            for index, script in enumerate(scripts):
                if script.strip():
                    Path(f"/tmp/{page}-{index}.js").write_text(script, encoding="utf-8")
        PY
        for script in /tmp/*.js; do
          [ -f "$script" ] || continue
          node --check "$script"
        done

    - name: Run Comparative MLFQ Simulation
      run: |
        python cli.py --compare --sim-time 60 --processes 6

    - name: Publish Step Summary
      run: |
        cat << 'EOF' >> $GITHUB_STEP_SUMMARY
        # 🎓 OS Group Project 7: MLFQ Simulation Results
        **Course:** Operating Systems | **Project:** Round Robin Time Slicing with Multilevel Feedback
        
        ### 👥 Team Members
        - **AP24110010509** — VEERAPANENI VARALAKSHMI
        - **AP24110010538** — GANDHAM SAI POOJITHA
        - **AP24110012001** — KANDIMALLA KEERTHI SREE
        - **AP24110011723** — ARADHYA SINGH
        
        ---
        ### 📊 Performance Summary
        All unit tests and comparative simulations passed successfully with 0 errors!
        EOF

    - name: Upload Report Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: simulation-files
        path: |
          index.html
          app.js
          simulation_results.html
          PROJECT_REPORT.md
